<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap - LearnIT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Üst Menü -->
  <header>
    <a href="index.html" class="brand">
      <span>&lt;/&gt;</span> LearnIT
    </a>

    <nav class="nav-links" aria-label="Ana Menü">
      <a href="index.html" class="nav-link">Dersler</a>
      <a href="files.html" class="nav-link">Dosya Paylaşımı</a>
      <a href="lesson-add.html" class="nav-link">+ Ders Ekle</a>
    </nav>

    <div class="nav-actions">
      <span class="user-badge">Ziyaretçi</span>
      <a href="login.html" class="btn btn-secondary">Giriş Yap</a>
    </div>
  </header>

  <!-- Giriş Alanı -->
  <main class="page-container page-container--narrow">
    <section class="content-card">
      <h1 class="card-title">LearnIT Giriş Yap</h1>

      <form class="post-form post-form--no-margin" method="POST" action="login.php">
        <div class="form-group">
          <label for="authUsernameInput">Kullanıcı Adı</label>
          <input type="text" name="username" id="authUsernameInput" placeholder="Kullanıcı adınızı girin" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="authPasswordInput">Şifre</label>
          <input type="password" name="password" id="authPasswordInput" placeholder="Şifrenizi girin" required autocomplete="current-password">
        </div>

        <div class="form-group">
          <label for="authRoleSelect">Hesap Türü</label>
          <select name="role" id="authRoleSelect">
            <option value="student">Öğrenci Girişi</option>
            <option value="instructor">Öğretmen (Eğitmen) Girişi</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-block">Oturum Aç</button>
        </div>
      </form>

      <div class="auth-footer">
        Derslere göz atmak için <a href="index.html">ana sayfaya dönün</a>.
      </div>
    </section>
  </main>

</body>
</html>
